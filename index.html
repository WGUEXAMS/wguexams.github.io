<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WGUEXAMS — PenTest+ Practice Exam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#eef1f4;
  --panel:#ffffff;
  --panel-2:#f7f9fb;
  --panel-3:#eef1f4;
  --border:#d7dee6;
  --border-soft:#e6ebf0;
  --text:#12161c;
  --text-dim:#48505c;
  --text-faint:#8993a1;
  --cyan:#2563eb;
  --cyan-dim:#1d4ed8;
  --red:#d6484d;
  --green:#1c9a57;
  --amber:#b4790a;
  --sev-bg:#fbe1e2; --sev-text:#8a1f24; --sev-border:#eab8ba;
  --badge-good-bg:#dcf7e6; --badge-good-text:#116638;
  --badge-bad-bg:#fbe1e2; --badge-bad-text:#8a1f24;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;}
::selection{background:var(--cyan-dim);color:#fff;}

/* ---------- Landing screen ---------- */
#landingScreen{min-height:100vh;background:#eef1f4;color:#12161c;font-family:'Inter',system-ui,-apple-system,sans-serif;}
#landingScreen .menu-inner{max-width:720px;margin:0 auto;padding:4rem 2rem 5rem;}
#landingScreen .menu-top{margin-bottom:2.6rem;text-align:center;}
#landingScreen .menu-top h1{font-size:21px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:#12161c;margin:0;}
#landingScreen .menu-top .menu-sub{font-size:13.5px;color:#48505c;margin-top:6px;}
#landingScreen .exams-btn-fixed{position:fixed;bottom:24px;left:40px;z-index:1000;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;padding:15px 34px;border-radius:10px;background:#ffffff;color:#12161c;border:1px solid #d7dee6;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:9px;transition:all .15s ease;box-shadow:0 10px 30px rgba(18,22,28,0.08);}
#landingScreen .exams-btn-fixed:hover{border-color:#1d4ed8;background:#f7f9fb;}
@media(max-width:600px){#landingScreen .exams-btn-fixed{left:50%;transform:translateX(-50%);bottom:90px;}#landingScreen .exams-btn-fixed:hover{transform:translateX(-50%) translateY(-1px);}}
#landingScreen .coffee-btn-big{display:inline-flex;align-items:center;gap:16px;background:#FFDD00;border:none;border-radius:99px;padding:26px 52px;font-size:28px;font-weight:800;color:#000;cursor:pointer;text-decoration:none;box-shadow:0 14px 40px rgba(255,221,0,0.25);transition:transform .15s,box-shadow .15s;font-family:system-ui,-apple-system,sans-serif;margin-top:36px;}
#landingScreen .coffee-btn-big:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 18px 50px rgba(255,221,0,0.35);}
#landingScreen .coffee-btn-big span{font-size:40px;}
@media(max-width:600px){#landingScreen .coffee-btn-big{padding:18px 32px;font-size:20px;gap:12px;}#landingScreen .coffee-btn-big span{font-size:30px;}}
#landingScreen .begin-btn-fixed{position:fixed;bottom:24px;right:40px;z-index:1000;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;padding:15px 34px;border-radius:10px;background:#2563eb;color:#fff;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:9px;transition:all .15s ease;box-shadow:0 10px 30px rgba(37,99,235,0.3);}
#landingScreen .begin-btn-fixed:hover{filter:brightness(1.08);transform:translateY(-1px);}
@media(max-width:600px){#landingScreen .begin-btn-fixed{right:50%;transform:translateX(50%);bottom:20px;}#landingScreen .begin-btn-fixed:hover{transform:translateX(50%) translateY(-1px);}#landingScreen .exams-btn-fixed,#landingScreen .begin-btn-fixed{width:calc(100% - 40px);justify-content:center;}}

/* ---------- Exam chrome (ticket bar / flag bar / bottom bar) ---------- */
#examChrome{position:fixed;top:0;left:0;right:0;width:100%;z-index:200;display:none;}
.examtop{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#eaf1ff;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;font-family:'Inter',sans-serif;gap:12px;}
.examtop-left{background:none;border:none;color:#eaf1ff;font-size:15px;font-weight:600;cursor:pointer;padding:0;font-family:'Space Grotesk',sans-serif;text-align:left;}
.examtop-left:hover{text-decoration:underline;}
.examtop-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;}
.examtop-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dbeafe;white-space:nowrap;}
.examflagbar{background:#4a7fd6;display:flex;justify-content:flex-end;padding:8px 22px;}
.examflagbtn{background:none;border:none;color:#0d2b6b;font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;transition:background .15s ease;}
.examflagbtn:hover{background:rgba(255,255,255,0.25);}
.examflagbtn.flagged{background:#fff;color:#b5390b;}
.examflagbtn.flagged svg{fill:#b5390b;}
#examBottom{position:fixed;bottom:0;left:0;right:0;width:100%;z-index:200;background:linear-gradient(180deg,#1d4ed8,#2563eb);display:none;justify-content:flex-end;gap:14px;padding:12px 22px;}
.prevnext-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:#eaf1ff;padding:9px 18px;border-radius:7px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s ease;}
.prevnext-btn:hover{background:rgba(255,255,255,0.18);}
.prevnext-btn:disabled{cursor:default;opacity:.4;pointer-events:none;}
body.has-exam-chrome{overflow:hidden;height:100vh;}
body.has-exam-chrome #examScroll{position:fixed;top:100px;bottom:76px;left:0;right:0;overflow-y:auto;overflow-x:hidden;}
#examScroll{scrollbar-gutter:stable;display:none;}

.wrap{max-width:980px;margin:0 auto;padding:26px 24px 60px;}

/* ---------- Brief / incident-style header ---------- */
.brief{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;}
@media(max-width:640px){.brief{grid-template-columns:1fr;}.doc-btns{justify-content:flex-start;}}
.brief h1{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0;font-weight:600;color:var(--text);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.sev-chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:0.5px;background:var(--sev-bg);color:var(--sev-text);border:1px solid var(--sev-border);padding:3px 9px;border-radius:5px;}
.doc-btns{display:flex;gap:10px;flex-wrap:wrap;}
.doc-btn{display:flex;align-items:center;gap:9px;border:none;color:#fff;padding:10px 16px;border-radius:9px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s ease;background:linear-gradient(180deg,#2563eb,#1d4ed8);}
.doc-btn:hover{filter:brightness(1.08);}

.qread-overlay{position:fixed;inset:0;background:rgba(10,14,20,0.55);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;}
.qread-overlay.show{display:flex;}
.qread-modal{width:min(720px,95vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,0.25);}
.qread-bar{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#eaf1ff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;border-top-left-radius:12px;border-top-right-radius:12px;}
.qread-bar .title{display:flex;align-items:center;gap:10px;}
.qx-close{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qread-body{padding:20px 22px;font-size:14px;line-height:1.7;color:var(--text-dim);}
.qread-body p{margin:0 0 12px;}
.qread-body p:last-child{margin-bottom:0;}
.qread-body strong{color:var(--text);}

/* ---------- Terminal / output panels ---------- */
.term-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:22px;overflow:hidden;}
.term-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel-2);flex-wrap:wrap;}
.term-tab{padding:12px 22px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s ease;background:none;border-left:none;border-right:none;border-top:none;}
.term-tab.active{color:var(--cyan);border-bottom-color:var(--cyan);background:var(--panel-3);}
.term-body{background:#050a0f;padding:16px 18px;max-height:380px;overflow:auto;}
.term-body pre{margin:0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;color:#c9d6e0;white-space:pre-wrap;word-break:break-word;}

/* ---------- Generic section card ---------- */
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:22px;}
.section h2{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 4px;color:var(--text);font-weight:600;}
.section .sub{color:var(--text-faint);font-size:12.5px;margin-bottom:18px;font-family:'IBM Plex Mono',monospace;}

/* ---------- Findings / answer grid ---------- */
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:700px){.answer-grid{grid-template-columns:1fr;}}
.qbox{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:16px 18px;}
.qbox.actions-box{grid-column:1 / -1;}
.qbox label{display:block;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:var(--text);margin-bottom:10px;}
.qbox select{width:100%;background:var(--panel-3);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;}
.fb{font-size:12px;font-family:'IBM Plex Mono',monospace;min-height:16px;margin-top:6px;}
.fb.correct{color:var(--green);}
.fb.incorrect{color:var(--red);}

.chk-list{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;}
.chk{display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:13.5px;color:var(--text-dim);cursor:pointer;border-bottom:1px solid var(--border-soft);background:var(--panel-3);}
.chk:last-child{border-bottom:none;}
.chk:hover{background:var(--panel-2);color:var(--text);}
.chk input{width:17px;height:17px;flex-shrink:0;accent-color:var(--cyan);}
.chk .badge{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:4px;display:none;white-space:nowrap;flex:none;}
.chk .badge.correct{display:inline-block;background:var(--badge-good-bg);color:var(--badge-good-text);}
.chk .badge.incorrect{display:inline-block;background:var(--badge-bad-bg);color:var(--badge-bad-text);}

/* ---------- Actions row ---------- */
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center;}
.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all .15s ease;}
.btn-primary{background:var(--cyan);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text-dim);}
.btn-ghost:hover{background:var(--panel-2);color:var(--text);}
.score-pill{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);color:var(--text-dim);display:none;}
.score-pill.show{display:inline-block;}
.score-pill.full{border-color:var(--green);color:var(--green);}
.score-pill.partial{border-color:var(--amber);color:var(--amber);}

/* ---------- Analysis / explanation ---------- */
.analysis{margin-top:20px;border-top:1px solid var(--border-soft);padding-top:18px;display:none;}
.analysis.show{display:block;}
.analysis h3{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:0 0 12px;color:var(--cyan);}
.analysis p{margin:0 0 10px;font-size:13.5px;color:var(--text-dim);line-height:1.65;}
.analysis ul{margin:0 0 10px;padding-left:20px;}
.analysis li{font-size:13.5px;color:var(--text-dim);line-height:1.65;margin-bottom:6px;}
.analysis strong{color:var(--text);}

/* ---------- Reused components from earlier question-type builds ---------- */
.table-wrap{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;overflow-x:auto;}
table.pbq{width:100%;border-collapse:collapse;min-width:760px;}
table.pbq th{text-align:left;font-weight:650;font-size:.82rem;color:var(--text-dim);padding:8px 14px;border-bottom:1px solid var(--border-soft);border-top:1px solid var(--border-soft);font-family:'Space Grotesk',sans-serif;}
table.pbq td{padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
table.pbq tr:last-child td{border-bottom:0;}
td.payload code{display:block;font:13px/1.45 'IBM Plex Mono',monospace;background:var(--panel-3);padding:7px 9px;border-radius:4px;word-break:break-all;color:var(--text);}
.cell-select{width:100%;font:inherit;font-size:.85rem;padding:7px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:'IBM Plex Mono',monospace;cursor:pointer;}
.cell-select.correct{border-color:var(--green);background:var(--badge-good-bg);}
.cell-select.wrong{border-color:var(--red);background:var(--badge-bad-bg);}
.row-fb{font-size:.78rem;margin-top:4px;}
.row-fb.good{color:var(--green);}
.row-fb.bad{color:var(--red);}

.sim{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;overflow:hidden;}
.urlbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-soft);background:var(--panel-3);}
.urlbar .nav-dots{color:var(--text-faint);letter-spacing:4px;}
.urlbar .url{flex:1;background:var(--panel);border:1px solid var(--border-soft);border-radius:999px;padding:4px 14px;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
.viewport{padding:16px;min-height:340px;}
.login-mock{background:#00a9c6;border-radius:6px;padding:26px 16px 28px;text-align:center;color:#fff;}
.login-mock h2{margin:0 0 16px;font-size:1.4rem;}
.login-mock .field{width:min(300px,90%);margin:0 auto 10px;padding:12px 14px;background:#2f3bc4;text-align:left;color:#fff;border-radius:3px;}
.login-mock .go{width:min(300px,90%);margin:16px auto 0;padding:12px;background:#ffd04a;color:#111;font-weight:600;border-radius:3px;}
.sim-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 14px;border-top:1px solid var(--border-soft);}
.sim-actions button{font-family:'IBM Plex Mono',monospace;font-size:.82rem;padding:10px 6px;border-radius:5px;background:var(--panel);border:1px solid var(--border);cursor:pointer;color:var(--text-dim);}
.sim-actions button.active{border-color:var(--cyan);box-shadow:inset 0 0 0 2px var(--cyan);color:var(--cyan);}
@media(max-width:560px){.sim-actions{grid-template-columns:repeat(2,1fr);}}
.cert{max-width:480px;margin:0 auto;border:2px solid #4aa8e8;border-radius:4px;background:#fff;color:#111;}
.cert .title{background:#62bdf6;padding:8px 12px;font-size:1.05rem;text-align:center;}
.cert .tabs{display:flex;gap:2px;padding:8px 12px 0;background:#e9f4fc;font-size:.82rem;}
.cert .tabs span{padding:4px 10px;border:1px solid #bbb;border-bottom:0;background:#ddd;}
.cert .tabs span.on{background:#fff;}
.cert .inner{padding:14px 18px;}
.cert h3{margin:0 0 8px;font-size:.95rem;border-bottom:1px solid #333;padding-bottom:8px;}
.cert dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 16px;margin:16px 0 8px;}
.cert dt{font-weight:700;}
.cert dd{margin:0;}
.cert .btns{display:flex;justify-content:flex-end;gap:10px;padding:0 18px 12px;}
.cert .btns span{border:1px solid #888;background:#eee;padding:3px 10px;font-size:.82rem;}
pre.src{margin:0;font:12.5px/1.5 'IBM Plex Mono',monospace;white-space:pre-wrap;word-break:break-word;background:var(--panel-3);padding:14px;border-radius:6px;overflow-x:auto;}
.ln{display:block;}
.ln b{display:inline-block;width:2.2em;color:var(--text-faint);font-weight:400;user-select:none;}
.ck-wrap{overflow-x:auto;}
table.ck{border-collapse:collapse;width:100%;min-width:700px;font-size:.8rem;}
table.ck th,table.ck td{border:1px solid var(--border-soft);padding:4px 8px;text-align:left;vertical-align:top;word-break:break-all;}
table.ck th{background:var(--panel-3);}
table.ck td.cb{text-align:center;white-space:nowrap;}
.dnd{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.dnd{grid-template-columns:1fr;}}
.opt{background:#f58220;color:#fff;padding:12px 14px;margin-bottom:8px;border-radius:3px;cursor:grab;font-weight:600;user-select:none;font-size:.88rem;}
.opt:active{cursor:grabbing;}
.slot-label{font-weight:650;color:var(--cyan);margin:10px 0 4px;font-size:.85rem;}
.slot{min-height:52px;border:2px dashed #f58220;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:4px;background:var(--panel);}
.slot.over{background:var(--panel-2);}
.slot .q{font-size:1.5rem;color:#f58220;font-weight:700;}
.slot .opt{margin:0;width:100%;}
.slot.correct{border:2px solid var(--green);}
.slot.wrong{border:2px solid var(--red);}
.pool{min-height:56px;padding:4px;border-radius:4px;}
.hint{color:var(--text-faint);font-size:.8rem;margin-top:6px;}

.simgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start;}
@media(max-width:820px){.simgrid{grid-template-columns:minmax(0,1fr);}}
.net{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:16px 12px;text-align:center;}
.ws{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:10px 20px 11px;border-radius:8px;background:#d9f5ee;color:#0b6b57;font-weight:700;letter-spacing:.03em;font-size:.82rem;}
.down{color:#19b394;font-size:1.5rem;line-height:1.2;margin:4px 0;}
.zones{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,2.2fr);gap:8px;align-items:stretch;}
@media(max-width:560px){.zones{grid-template-columns:1fr;}.linkarrow{transform:rotate(90deg);}}
.zone{display:flex;flex-direction:column;border:2px dashed var(--border);border-radius:8px;padding:10px 8px 12px;min-width:0;}
.zone h4{margin:0 0 10px;font-size:.78rem;letter-spacing:.05em;text-align:center;white-space:nowrap;}
.zone.cdn h4,.zone.cdn .node{color:#d98200;}
.zone.prod h4,.zone.prod .node{color:#2b6fe0;}
.zone .nodes{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;}
.node .ico{height:52px;display:flex;align-items:center;justify-content:center;}
.zone .arrow{color:#19b394;font-weight:700;}
.linkarrow{align-self:center;color:#19b394;font-size:1.5rem;font-weight:700;}
.node{background:var(--panel);border:2px solid currentColor;border-radius:8px;padding:10px 6px;min-width:110px;min-height:120px;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.node:hover{background:var(--panel-2);}
.node.active{box-shadow:0 0 0 3px currentColor;}
.node .nn{font-weight:700;font-size:.85rem;white-space:nowrap;}
.node .nh{font-size:.65rem;opacity:.85;white-space:nowrap;}
.nmap{margin-top:14px;border-radius:6px;overflow:hidden;border:1px solid var(--border-soft);}
.nmap .nh2{background:#0d6efd;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem;}
.nmap .nh2 button{background:transparent;color:#fff;border:2px solid #fff;border-radius:4px;padding:0 8px;line-height:1.4;cursor:pointer;}
.nmap pre{margin:0;background:#050a0f;color:#c9d6e0;padding:14px 16px;font:12.5px/1.6 'IBM Plex Mono',monospace;overflow-x:auto;white-space:pre;}
.simright .term-tabs{border-radius:8px 8px 0 0;}

.hotpanel{border-radius:8px;overflow:hidden;border:1px solid var(--border-soft);}
.hotprompt{padding:10px 14px;font-size:.95rem;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;font-family:'Space Grotesk',sans-serif;font-weight:600;}
.hotprompt .cnt{font-size:.78rem;color:var(--text-faint);white-space:nowrap;padding-top:3px;font-family:'IBM Plex Mono',monospace;font-weight:400;}
.robots{padding:6px 4px 10px;}
.rline{display:flex;align-items:center;gap:10px;padding:4px 8px;border:1px solid transparent;border-radius:4px;cursor:pointer;font:13px/1.5 'IBM Plex Mono',monospace;}
.rline:hover{background:var(--panel-2);}
.rline .rn{width:1.8em;text-align:right;color:var(--text-faint);flex:none;}
.rline input{flex:none;}
.rline.good{border-color:var(--green);background:var(--badge-good-bg);}
.rline.bad{border-color:var(--red);background:var(--badge-bad-bg);}
.rline.missed{border-color:var(--amber);background:#fdecd2;}

.reconbox .rh{background:#0d6efd;color:#fff;padding:10px 16px;font-weight:650;font-size:.9rem;}
.reconbox pre{margin:0;background:#050a0f;color:#c9d6e0;font:12.5px/1.5 'IBM Plex Mono',monospace;padding:14px 16px;white-space:pre-wrap;word-break:break-word;overflow-x:auto;}
.cmdlist{list-style:none;margin:0;padding:10px 16px;background:var(--panel);}
.cmdlist li{font:12.5px/1.6 'IBM Plex Mono',monospace;padding:2px 0;color:var(--text-dim);}
.cmdnote{font-size:.8rem;color:var(--text-faint);padding:8px 16px 12px;background:var(--panel);}

/* ============================================================
   TYPE: table (Q1)
============================================================ */
function bodyTable(q, st, stage) {
  const sec = el("div", "section");
  sectionHead(sec, q.caption, "Select the vulnerability type and remediation for each payload.");
  const wrap = el("div", "table-wrap");
  const table = el("table", "pbq");
  const thead = el("thead"); thead.innerHTML = "<tr><th>Payloads</th><th>Vulnerability Type</th><th>Remediation</th></tr>"; table.appendChild(thead);
  const tbody = el("tbody");

  q.rows.forEach((row, i) => {
    const tr = el("tr");
    const td0 = el("td", "payload"); td0.appendChild(el("code", null, row.payload));

    const td1 = el("td");
    const s1 = makeSelect(q.vulnOptions, st.rows[i].vuln, v => { st.rows[i].vuln = v; clearFeedback(); }, `Vulnerability type for payload ${i + 1}`);
    td1.appendChild(s1);

    const td2 = el("td");
    const s2 = makeSelect(q.remedOptions, st.rows[i].remed, v => { st.rows[i].remed = v; clearFeedback(); }, `Remediation for payload ${i + 1}`);
    td2.appendChild(s2);
    const fb = el("div", "row-fb");
    td2.appendChild(fb);

    tr.append(td0, td1, td2); tbody.appendChild(tr);
  });
  table.appendChild(tbody); wrap.appendChild(table); sec.appendChild(wrap);

  const { row: actionsRow, pill } = buildActions(doSubmit, doShow, doReset);
  sec.appendChild(actionsRow);
  const analysisHtml = "<ul>" + q.rows.map(r => `<li><strong>${r.payload.replace(/</g, "&lt;")}</strong> — ${r.vuln}, remediated with: ${r.remed}. ${r.why}</li>`).join("") + "</ul>";
  const analysisBox = buildAnalysis(analysisHtml);
  sec.appendChild(analysisBox);
  stage.appendChild(sec);

  function clearFeedback() {
    sec.querySelectorAll(".cell-select").forEach(s => s.classList.remove("correct", "wrong"));
    sec.querySelectorAll(".row-fb").forEach(f => { f.textContent = ""; f.className = "row-fb"; });
    pill.classList.remove("show", "full", "partial");
    analysisBox.classList.remove("show");
  }

  function doSubmit() {
    let points = 0; const total = q.rows.length * 2;
    [...tbody.children].forEach((tr, i) => {
      const s1 = tr.children[1].querySelector("select");
      const s2 = tr.children[2].querySelector("select");
      const fb = tr.children[2].querySelector(".row-fb");
      const vOk = s1.value === q.rows[i].vuln, rOk = s2.value === q.rows[i].remed;
      s1.classList.remove("correct", "wrong"); s1.classList.add(vOk ? "correct" : "wrong");
      s2.classList.remove("correct", "wrong"); s2.classList.add(rOk ? "correct" : "wrong");
      if (vOk) points++; if (rOk) points++;
      fb.textContent = (vOk && rOk) ? "Correct" : "Check this row";
      fb.className = "row-fb " + ((vOk && rOk) ? "good" : "bad");
    });
    setPill(pill, points, total);
    analysisBox.classList.add("show");
  }

  function doShow() {
    q.rows.forEach((row, i) => {
      st.rows[i] = { vuln: row.vuln, remed: row.remed };
      const tr = tbody.children[i];
      tr.children[1].querySelector("select").value = row.vuln;
      tr.children[2].querySelector("select").value = row.remed;
    });
    doSubmit();
  }

  function doReset() { states[current] = freshState(q); renderQuestion(); }
}

/* ============================================================
   TYPE: dnd (Q2) — browser sim (cert/source/cookies) + drag steps
============================================================ */
const VIEW_META = {
  login: { hash: "" }, viewcert: { hash: "#viewcertificate" }, viewsrc: { hash: "#viewsource" },
  viewck: { hash: "#viewcookies" }, remcert: { hash: "#remediatecertificate" }, remsrc: { hash: "#remediatesource" }, remck: { hash: "#remediatecookies" }
};
const BUTTONS = [
  ["viewcert", "View Certificate"], ["viewsrc", "View Source"], ["viewck", "View Cookies"],
  ["remcert", "Remediate Certificate"], ["remsrc", "Remediate Source"], ["remck", "Remediate Cookies"]
];

function bodyDnd(q, st, stage) {
  const sec = el("div", "section");
  sectionHead(sec, "Secure System — Browser Investigation", "Click each view, then drag the correct remediation steps into order.");

  const simWrap = el("div");
  sec.appendChild(simWrap);
  renderDndSim();

  const { row: actionsRow, pill } = buildActions(doSubmit, doShow, doReset);
  sec.appendChild(actionsRow);
  const analysisBox = buildAnalysis(q.explain);
  sec.appendChild(analysisBox);
  stage.appendChild(sec);

  function renderDndSim() {
    simWrap.innerHTML = "";
    const sim = el("div", "sim");
    const bar = el("div", "urlbar");
    bar.appendChild(el("span", "nav-dots", "‹ › ↻"));
    bar.appendChild(el("div", "url", "https://company.org/login.aspx" + VIEW_META[st.view].hash));
    sim.appendChild(bar);

    const vp = el("div", "viewport");
    if (st.view === "login") vp.appendChild(loginView());
    if (st.view === "viewcert") vp.appendChild(certView());
    if (st.view === "viewsrc") vp.appendChild(sourceView(false));
    if (st.view === "viewck") vp.appendChild(cookieView(false, st));
    if (st.view === "remcert") vp.appendChild(dndView(q, st));
    if (st.view === "remsrc") vp.appendChild(sourceView(true));
    if (st.view === "remck") vp.appendChild(cookieView(true, st));
    sim.appendChild(vp);

    const actions = el("div", "sim-actions");
    BUTTONS.forEach(([id, label]) => {
      const b = el("button", st.view === id ? "active" : "", label); b.type = "button";
      b.addEventListener("click", () => { st.view = id; renderDndSim(); clearFeedback(); });
      actions.appendChild(b);
    });
    sim.appendChild(actions);
    simWrap.appendChild(sim);
  }

  function clearFeedback() {
    pill.classList.remove("show", "full", "partial");
    analysisBox.classList.remove("show");
  }

  function doSubmit() {
    let best = q.orders[0], bestN = -1;
    q.orders.forEach(o => { const n = o.filter((id, i) => st.slots[i] === id).length; if (n > bestN) { bestN = n; best = o; } });
    const filled = st.slots.every(Boolean);
    const tampered = Object.values(st.flags).some(Boolean);
    const componentPoint = filled && !tampered ? 1 : 0;
    const points = bestN + componentPoint;
    if (st.view !== "remcert") { st.view = "remcert"; renderDndSim(); }
    setPill(pill, points, 5);
    analysisBox.classList.add("show");
  }

  function doShow() {
    st.slots = q.orders[0].slice();
    st.flags = {};
    st.view = "remcert";
    renderDndSim();
    doSubmit();
  }

  function doReset() { states[current] = freshState(q); renderQuestion(); }
}

function loginView() {
  const d = el("div", "login-mock");
  d.appendChild(el("h2", null, "Secure System"));
  d.appendChild(el("div", "field", "User name"));
  d.appendChild(el("div", "field", "Password"));
  d.appendChild(el("div", "go", "Login"));

function certView() {

  inner.appendChild(dl); c.appendChild(inner);

function sourceView(numbered) {
  const wrap = el("div");
  if (numbered) wrap.appendChild(el("div", "cmdnote", "Read-only in this practice version. Only one component should be remediated, and the question asks for the highest-severity one."));
  const pre = el("pre", "src");
  SOURCE_LINES.forEach((line, i) => {
    const row = el("span", "ln");
    if (numbered) row.appendChild(el("b", null, String(i + 1)));
    row.appendChild(document.createTextNode(line));
    pre.appendChild(row);
  });
  wrap.appendChild(pre);
  return wrap;
}

function cookieView(editable, st) {
  const wrap = el("div");
  if (editable) wrap.appendChild(el("div", "cmdnote", "Changing flags here counts as remediating cookies. For this question, only the highest-severity component should be remediated."));
  const holder = el("div", "ck-wrap"); const t = el("table", "ck");
  const head = el("tr");
  ["Name", "Value", "Domain", "Path", "Expires/…", "Size", "HTTP", "Secure", "SameSite"].forEach(h => head.appendChild(el("th", null, h)));
  const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
  const tb = el("tbody");
  COOKIES.forEach((c, r) => {
    const tr = el("tr");
    c.forEach(v => tr.appendChild(el("td", null, v)));
    ["http", "secure", "samesite"].forEach(col => {
      const td = el("td", "cb");
      if (editable) {
        const key = r + "-" + col;
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!st.flags[key];
        cb.setAttribute("aria-label", `${c[0]} ${col}`);
        cb.addEventListener("change", () => { st.flags[key] = cb.checked; });
        td.appendChild(cb);
        if (col === "samesite") td.appendChild(document.createTextNode(" delete"));
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb); holder.appendChild(t); wrap.appendChild(holder);
  return wrap;
}

function dndView(q, st) {
  const grid = el("div", "dnd");
  const left = el("div"); const right = el("div");

  left.appendChild(el("h3", null, "Drag and Drop Options:"));
  const pool = el("div", "pool");
  const placed = new Set(st.slots.filter(Boolean));
  q.options.filter(o => !placed.has(o.id)).forEach(o => pool.appendChild(makeOpt(o, q, st)));
  allowDrop(pool, () => null, q, st);
  left.appendChild(pool);
  left.appendChild(el("div", "hint", "Drag an option into a step, or click an option to place it in the next open step. Click a placed option to return it."));

  st.slots.forEach((id, i) => {
    right.appendChild(el("div", "slot-label", `Step ${i + 1}`));
    const slot = el("div", "slot"); slot.dataset.i = i; slot.tabIndex = 0;
    if (id) slot.appendChild(makeOpt(q.options.find(o => o.id === id), q, st));
    else slot.appendChild(el("span", "q", "?"));
    allowDrop(slot, () => i, q, st);
    right.appendChild(slot);
  });

  grid.append(left, right);
  return grid;
}

function makeOpt(o, q, st) {
  const d = el("div", "opt", o.text);
  d.draggable = true; d.tabIndex = 0; d.dataset.id = o.id;
  d.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", o.id); e.dataTransfer.effectAllowed = "move"; });
  const act = () => {
    const at = st.slots.indexOf(o.id);
    if (at >= 0) st.slots[at] = null;
    else { const free = st.slots.indexOf(null); if (free >= 0) st.slots[free] = o.id; }
    renderQuestion();
  };
  d.addEventListener("click", act);
  d.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  return d;
}

function allowDrop(target, slotIndex, q, st) {
  target.addEventListener("dragover", e => { e.preventDefault(); target.classList.add("over"); });
  target.addEventListener("dragleave", () => target.classList.remove("over"));
  target.addEventListener("drop", e => {
    e.preventDefault(); target.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain"); if (!id) return;
    const from = st.slots.indexOf(id); if (from >= 0) st.slots[from] = null;
    const to = slotIndex();
    if (to !== null) st.slots[to] = id;
    renderQuestion();
  });
}

/* ============================================================
   TYPE: multi (Q3) — tabbed output + findings tied to each tab
============================================================ */
function blockResult(b, ans) {
  if (b.kind === "radio") return { points: ans === b.answer ? 1 : 0, total: 1 };
  if (b.kind === "checks") {
    const sel = ans || [];
    const good = sel.filter(x => b.answers.includes(x)).length, bad = sel.length - good;
    return { points: Math.max(0, good - bad), total: b.answers.length };
  }
  const sel = ans || [];
  return { points: b.items.filter((it, i) => sel[i] === it.answer).length, total: b.items.length };
}

function bodyMulti(q, st, stage) {
  const sec = el("div", "section");
  sectionHead(sec, q.title, "Review each output tab, then answer its findings below.");

  const panel = el("div", "term-panel");
  const tabs = el("div", "term-tabs");
  q.outputs.forEach((o, i) => {
    const b = el("button", "term-tab" + (i === st.tab ? " active" : ""), o.label); b.type = "button";
    b.addEventListener("click", () => { st.tab = i; rerender(); });
    tabs.appendChild(b);
  });
  panel.appendChild(tabs);
  const body = el("div", "term-body");
  const pre = el("pre", null, q.outputs[st.tab].text);
  body.appendChild(pre);
  panel.appendChild(body);
  sec.appendChild(panel);

  const findingsWrap = el("div");
  sec.appendChild(findingsWrap);

  const { row: actionsRow, pill } = buildActions(doSubmit, doShow, doReset);
  sec.appendChild(actionsRow);
  const analysisHtml = "<ul>" + q.blocks.map(b => `<li>${(b.why || (b.items ? b.items.map(it => it.why).join(" ") : ""))}</li>`).join("") + "</ul>";
  const analysisBox = buildAnalysis(analysisHtml);
  sec.appendChild(analysisBox);
  stage.appendChild(sec);

  function rerender() {
    [...tabs.children].forEach((btn, i) => btn.classList.toggle("active", i === st.tab));
    pre.textContent = q.outputs[st.tab].text;
    renderFindings();
  }

  function renderFindings() {
    findingsWrap.innerHTML = "";
    const grid = el("div", "answer-grid");
    q.blocks.forEach((b, bi) => {
      if (b.output !== st.tab) return;
      if (b.kind === "radio" || b.kind === "checks") {
        const multi = b.kind === "checks";
        const box = el("div", "qbox" + (multi ? " actions-box" : ""));
        const lab = el("label"); lab.innerHTML = b.header; box.appendChild(lab);
        if (b.context) { const c = el("div", "sub"); c.innerHTML = b.context; c.style.marginBottom = "10px"; box.appendChild(c); }
        if (!multi) {
          const sel = st.ans[bi];
          b.options.forEach(opt => {
            const lbl = el("label", "chk");
            const inp = document.createElement("input"); inp.type = "radio"; inp.name = "b" + bi; inp.value = opt; inp.checked = sel === opt;
            inp.addEventListener("change", () => { st.ans[bi] = opt; clearFeedback(); });
            const span = el("span", null, opt);
            const badge = el("span", "badge");
            if (st.checked) { const ok = opt === b.answer; if (inp.checked) { badge.classList.add(ok ? "correct" : "incorrect"); badge.textContent = ok ? "Correct" : "Incorrect"; } }
            lbl.append(inp, span, badge);
            box.appendChild(lbl);
          });
        } else {
          if (b.prompt) { const p = el("div"); p.innerHTML = b.prompt; p.style.marginBottom = "8px"; p.style.fontSize = "13px"; p.style.color = "var(--text-dim)"; box.appendChild(p); }

            const span = el("span", null, opt);

      else if (b.kind === "checks") st.ans[bi] = b.answers.slice();

  }

  function doReset() { states[current] = freshState(q); renderQuestion(); }
}

/* ============================================================
   HELPERS
============================================================ */
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function makeSelect(options, value, onChange, label) {
  const sel = document.createElement("select");
  sel.className = "cell-select";
  sel.setAttribute("aria-label", label);
  const blank = document.createElement("option"); blank.value = ""; blank.textContent = "Select"; sel.appendChild(blank);
  options.forEach(o => { const opt = document.createElement("option"); opt.value = o; opt.textContent = o; sel.appendChild(opt); });
  sel.value = value;
  sel.addEventListener("change", () => onChange(sel.value));
  return sel;
}

function sectionHead(sec, titleText, subText) {
  if (titleText) sec.appendChild(el("h2", null, titleText));
  if (subText) sec.appendChild(el("div", "sub", subText));
}

function buildActions(onSubmit, onShow, onReset) {
  const row = el("div", "actions");
  const submitBtn = el("button", "btn btn-primary", "Submit"); submitBtn.type = "button";
  const showBtn = el("button", "btn btn-ghost", "Show Answer"); showBtn.type = "button";
  const resetBtn = el("button", "btn btn-ghost", "Reset"); resetBtn.type = "button";
  const pill = el("span", "score-pill");
  submitBtn.addEventListener("click", onSubmit);
  showBtn.addEventListener("click", onShow);
  resetBtn.addEventListener("click", onReset);
  row.append(submitBtn, showBtn, resetBtn, pill);
  return { row, pill };
}

function setPill(pill, points, total) {
  pill.textContent = `${points} / ${total} correct`;
  pill.className = "score-pill show " + (points === total ? "full" : (points > 0 ? "partial" : ""));
}

function buildAnalysis(html) {
  const a = el("div", "analysis");
  a.appendChild(el("h3", null, "Explanation"));
  const body = el("div"); body.innerHTML = html;
  a.appendChild(body);
  return a;
}

/* ============================================================
   STATE
============================================================ */
function freshState(q) {
  if (q.type === "table") return { rows: q.rows.map(() => ({ vuln: "", remed: "" })), checked: false };
  if (q.type === "dnd") return { view: "login", slots: [null, null, null, null], flags: {}, result: null, checked: false };
  if (q.type === "multi") return { tab: 0, ans: {}, checked: false };
  if (q.type === "sim") return { open: null, tab: "vuln", ans: { vuln: "", rem: [] }, checked: false };
  if (q.type === "hotspot") return { sel: [], tool: "", checked: false };
  if (q.type === "recon2") return { tab: 0, p1: "", esc: "", rem: [], checked: false };
  return { checked: false };
}
const states = questions.map(q => freshState(q));

/* ============================================================
   GLOBAL CONTROLLER
============================================================ */
let current = 0;
const flagged = new Set();
let timerSeconds = 90 * 60;
let timerInterval = null;

function formatTimer(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}
function tickTimer() {
  if (timerSeconds > 0) timerSeconds--;
  $("examTimerText").textContent = "Time Remaining " + formatTimer(timerSeconds);
  if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval = null; }
}
function startTimer() {
  if (timerInterval) return;
  $("examTimerText").textContent = "Time Remaining " + formatTimer(timerSeconds);
  timerInterval = setInterval(tickTimer, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function openQRead() { $("qreadOverlay").classList.add("show"); }
function closeQRead() { $("qreadOverlay").classList.remove("show"); }

function renderQuestion() {
  const q = questions[current], st = states[current];

  $("examCounterText").textContent = (current + 1) + " of " + questions.length;
  $("examFlagBtn").classList.toggle("flagged", flagged.has(current));
  $("prevBtn").disabled = current === 0;
  $("nextBtn").disabled = current === questions.length - 1;

  $("briefTitle").firstChild && ($("briefTitle").firstChild.textContent = "");
  $("briefTitle").childNodes[0] ? ($("briefTitle").childNodes[0].nodeValue = q.title + " ") : null;
  // rebuild title text node safely
  const titleEl = $("briefTitle");
  titleEl.textContent = "";
  titleEl.appendChild(document.createTextNode(q.title + " "));
  const chip = el("span", "sev-chip", q.kind.toUpperCase());
  titleEl.appendChild(chip);

  const qbody = $("qreadBody"); qbody.innerHTML = "";
  q.scenario.forEach(t => { const p = el("p"); p.innerHTML = t; qbody.appendChild(p); });
  closeQRead();

  const stage = $("stage"); stage.innerHTML = "";
  if (q.type === "table") bodyTable(q, st, stage);
  else if (q.type === "dnd") bodyDnd(q, st, stage);
  else if (q.type === "multi") bodyMulti(q, st, stage);
  else if (q.type === "sim") bodySim(q, st, stage);
  else if (q.type === "hotspot") bodyHotspot(q, st, stage);
  else if (q.type === "recon2") bodyRecon(q, st, stage);

  $("examScroll").scrollTop = 0;
}

function goTo(i) { current = i; renderQuestion(); }

$("beginBtn").addEventListener("click", () => {
  $("landingScreen").style.display = "none";
  document.body.classList.add("has-exam-chrome");
  $("examChrome").style.display = "block";
  $("examScroll").style.display = "block";
  $("examBottom").style.display = "flex";
  startTimer();
  goTo(0);
});
$("homeBtn").addEventListener("click", () => {
  document.body.classList.remove("has-exam-chrome");
  $("examChrome").style.display = "none";
  $("examScroll").style.display = "none";
  $("examBottom").style.display = "none";
  stopTimer();
  closeQRead();
  $("landingScreen").style.display = "block";
});
$("examFlagBtn").addEventListener("click", () => {
  if (flagged.has(current)) flagged.delete(current); else flagged.add(current);
  $("examFlagBtn").classList.toggle("flagged", flagged.has(current));
});
$("prevBtn").addEventListener("click", () => { if (current > 0) goTo(current - 1); });
$("nextBtn").addEventListener("click", () => { if (current < questions.length - 1) goTo(current + 1); });
$("qreadBtn").addEventListener("click", openQRead);
$("qreadClose").addEventListener("click", closeQRead);
$("qreadOverlay").addEventListener("click", (e) => { if (e.target === $("qreadOverlay")) closeQRead(); });

</script>

</body>
</html>
